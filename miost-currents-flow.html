<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>MIOST Viewer — GPU Particle Flow from Multiscale Zarr (ol/layer/Flow)</title>
<link rel="stylesheet" href="https://esm.sh/ol@10.9.0/ol.css" />
<style>
  body { margin: 0; font-family: monospace; }
  #map { position: absolute; inset: 0; background: #000; }
  #panel {
    position: absolute; top: 10px; left: 10px; z-index: 1000;
    background: rgba(0,0,0,.75); color: #eee; padding: 10px 12px;
    border-radius: 6px; font-size: 12px; width: 260px;
  }
  #panel label { display: block; margin-top: 8px; }
  #panel input, #panel select { width: 100%; box-sizing: border-box; }
  #meta { margin-top: 6px; color: #aaa; }
  #lvl { margin-top: 4px; color: #fc6; }
  #readout { margin-top: 8px; color: #9fd; min-height: 3.2em; }
  #bar { height: 10px; border-radius: 2px; margin-top: 6px; }
  #ticks { display: flex; justify-content: space-between; color: #aaa; font-size: 11px; }
</style>
</head>
<body>
<div id="map"></div>
<div id="panel">
  <b>MIOST Currents — GPU Flow (Zarr)</b>
  <div id="meta">loading store…</div>
  <div id="lvl"></div>

  <label>go to
    <select id="place">
      <option value="-45,25,3">Global (Atlantic)</option>
      <option value="-75,30,5">Gulf Stream</option>
      <option value="145,35,5">Kuroshio</option>
      <option value="25,-38,5">Agulhas</option>
      <option value="-60,-50,4">Malvinas / Drake</option>
      <option value="-30,-2,4">Equatorial Atlantic</option>
    </select>
  </label>

  <label>current speed (viridis)
    <div id="bar"></div>
    <div id="ticks"></div>
  </label>

  <label>flow opacity <span id="opval">100%</span>
    <input id="opacity" type="range" min="0" max="1" step="0.05" value="1" />
  </label>

  <div id="readout">click the ocean for a value</div>
</div>

<script type="importmap">{"imports":{
  "ol/": "https://esm.sh/ol@10.9.0/",
  "zarrita": "https://esm.sh/zarrita@0.7.3"
}}</script>
<script type="module">
// The harmony-flow-py frontend's rendering — OpenLayers' ol/layer/Flow, GPU
// particle advection, viridis ramp — but fed from the multiscale GeoZarr
// pyramid instead of a u/v PNG. Their DataTileSource loader decoded PNG
// bytes; this one picks the pyramid level matching the tile's resolution,
// reads just the covering chunk window through ZarrSource (level choice,
// antimeridian stitch, int16 decode — shared with the other zarr pages), and
// bilinearly resamples it into each 256x256 float tile.
//
// Land masking is their trick, made explicit: invalid samples get a velocity
// whose speed exceeds maxSpeed, and the style expression renders that
// transparent.
import Map from 'ol/Map.js'
import View from 'ol/View.js'
import TileLayer from 'ol/layer/Tile.js'
import OSM from 'ol/source/OSM.js'
import Flow from 'ol/layer/Flow.js'
import DataTileSource from 'ol/source/DataTile.js'
import { createForProjection, wrapX } from 'ol/tilegrid.js'
import { get as getProjection } from 'ol/proj.js'
import { ZarrSource } from './zarr-gl/zarr-source.js'
import { WindowField } from './currents/zarr-current-field.js?v=1'

window.onerror = (m, s, l, c, e) => console.error('ERROR:', m, e?.stack ?? '')
window.onunhandledrejection = (e) => console.error('REJECTION:', e.reason?.stack ?? e.reason)

const el = (id) => document.getElementById(id)
const params = new URLSearchParams(location.search)
const resolveSource = (s) => /^https?:\/\//.test(s) ? s : new URL(s, location.href).href
const STORE = resolveSource(params.get('store') || 'data/miost_currents_pyramid.zarr')

// ---------- pyramid ----------
const uSrc = new ZarrSource({ url: STORE, variable: 'ugos' })
const vSrc = new ZarrSource({ url: STORE, variable: 'vgos' })
await Promise.all([uSrc.readyPromise, vSrc.readyPromise])
const scaleFill = { scale: uSrc.scaleFactor, fill: uSrc.fillValue }

// ---------- DataTile loader: zarr window -> 256x256 float u/v tile ----------
const dataTileProjection = getProjection('EPSG:4326')
const dataTileGrid = createForProjection(dataTileProjection, undefined, 256)
const dataTileSize = 256
const dataBands = 3

const maxSpeed = 2
const MASK = maxSpeed * 4 // decoded speed 11.3 m/s -> transparent in the style

async function windowFieldFor(extent, resolution) {
  // The 4326 tile grid's resolution is degrees per pixel directly, which is
  // exactly what ZarrSource keys its pyramid level choice on.
  const level = uSrc.chooseLevel(resolution)
  const vLevel = vSrc.levels[uSrc.levels.indexOf(level)]
  const win = {
    lonWest: extent[0], lonEast: extent[2],
    latSouth: Math.max(-90, extent[1]), latNorth: Math.min(90, extent[3]),
  }
  const [uWin, vWin] = await Promise.all([
    uSrc.readWindow({ level, ...win }),
    vSrc.readWindow({ level: vLevel, ...win }),
  ])
  if (!uWin || !vWin) return null
  return new WindowField(uWin, vWin, scaleFill)
}

const currents = new DataTileSource({
  projection: 'EPSG:4326',
  tileGrid: dataTileGrid,
  transition: 0,
  wrapX: true,
  async loader(z, x, y) {
    const tileCoord = wrapX(dataTileGrid, [z, x, y], dataTileProjection)
    const extent = dataTileGrid.getTileCoordExtent(tileCoord)
    const resolution = dataTileGrid.getResolution(z)
    const field = await windowFieldFor(extent, resolution)
    const data = new Float32Array(dataTileSize * dataTileSize * dataBands)
    for (let row = 0; row < dataTileSize; ++row) {
      let offset = row * dataTileSize * dataBands
      const lat = extent[3] - (row + 0.5) * resolution
      for (let col = 0; col < dataTileSize; ++col) {
        const lon = extent[0] + (col + 0.5) * resolution
        const s = field?.sample(lat, lon)
        if (s) {
          data[offset] = s[0]
          data[offset + 1] = s[1]
        } else {
          data[offset] = MASK
          data[offset + 1] = MASK
        }
        offset += dataBands
      }
    }
    return data
  },
})

// ---------- Flow layer, their styling ----------
const viridisColors = ['#440154', '#414487', '#2a788e', '#22a884', '#7ad151', '#fde725']
const colorStops = []
for (let i = 0; i < viridisColors.length; ++i) {
  colorStops.push((i * maxSpeed) / (viridisColors.length - 1))
  colorStops.push(viridisColors[i])
}
const flowColorExpression = [
  'case',
  ['>', ['get', 'speed'], maxSpeed],
  'rgba(0, 0, 0, 0)',
  ['interpolate', ['linear'], ['get', 'speed'], ...colorStops],
]

const flowLayer = new Flow({
  source: currents,
  maxSpeed,
  style: { color: flowColorExpression },
})

const map = new Map({
  target: 'map',
  layers: [new TileLayer({ source: new OSM() }), flowLayer],
  view: new View({ center: [-45, 25], zoom: 3, projection: 'EPSG:4326' }),
})

// ---------- panel ----------
el('bar').style.background =
  `linear-gradient(90deg, ${viridisColors.map((c, i) => `${c} ${(i / (viridisColors.length - 1)) * 100}%`).join(', ')})`
el('ticks').innerHTML = ['0', '0.7', '1.4', '2 m/s'].map((t) => `<span>${t}</span>`).join('')

el('opacity').oninput = () => {
  const v = +el('opacity').value
  flowLayer.setOpacity(v)
  el('opval').textContent = Math.round(v * 100) + '%'
}
el('place').onchange = () => {
  const [lon, lat, z] = el('place').value.split(',').map(Number)
  map.getView().animate({ center: [lon, lat], zoom: z, duration: 400 })
}

function showLevel() {
  const res = map.getView().getResolution()
  const level = uSrc.chooseLevel(res)
  el('lvl').textContent =
    `pyramid level: ${level.lat.size} × ${level.lon.size} @ ${level.lon.step.toFixed(3)}°/cell`
}
map.getView().on('change:resolution', showLevel)
showLevel()

map.on('click', async (e) => {
  const [lon, lat] = e.coordinate
  const field = await windowFieldFor([lon - 1, Math.max(-90, lat - 1), lon + 1, Math.min(90, lat + 1)], 0)
  const s = field?.sample(lat, lon)
  if (!s) {
    el('readout').textContent = 'no data at that point'
    return
  }
  const [u, v] = s
  const speed = Math.hypot(u, v)
  const dir = (90 - (Math.atan2(v, u) * 180) / Math.PI + 360) % 360
  el('readout').innerHTML =
    `speed <b>${speed.toFixed(3)}</b> m/s<br>` +
    `toward ${dir.toFixed(0)}&deg;<br>` +
    `u ${u.toFixed(3)}  v ${v.toFixed(3)} m/s`
})

const attrs = uSrc.attrs ?? {}
el('meta').innerHTML =
  `MIOST L4 (DUACS exp) &middot; ${attrs.date ?? '?'}<br>` +
  `zarr pyramid: ${uSrc.levels.length} levels, finest ` +
  `${uSrc.finest.lat.size} &times; ${uSrc.finest.lon.size}<br>` +
  `ol/layer/Flow — particles advected on the GPU`

window.__map = map
window.__flow = flowLayer
window.__uSrc = uSrc
window.__sampleAt = async (lon, lat) => {
  const f = await windowFieldFor([lon - 1, lat - 1, lon + 1, lat + 1], 0)
  return f?.sample(lat, lon)
}
</script>
</body>
</html>
