<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>MUR SST 1 km Zarr Viewer (Leaflet, custom WebGL layer)</title>
<link rel="stylesheet" href="https://esm.sh/leaflet@1.9.4/dist/leaflet.css" />
<style>
  body { margin: 0; font-family: monospace; }
  #map { position: absolute; inset: 0; }
  #panel {
    position: absolute; top: 10px; left: 10px; z-index: 1000;
    background: rgba(0,0,0,.75); color: #eee; padding: 10px 12px;
    border-radius: 6px; font-size: 12px; width: 240px;
  }
  #panel label { display: block; margin-top: 8px; }
  #panel input, #panel select { width: 100%; box-sizing: border-box; }
  #panel .row { display: flex; gap: 6px; }
  #panel .row label { flex: 1; }
  #readout { margin-top: 8px; color: #9fd; min-height: 2em; }
  #meta { margin-top: 6px; color: #aaa; min-height: 1em; }
  #warn { margin-top: 4px; color: #fc6; min-height: 1em; }
  #slicelabel { color: #ccc; }
  #tools { margin-top: 8px; }
  .toolbtn {
    flex: 1; padding: 4px 0; font: inherit; font-size: 12px; cursor: pointer;
    background: #222; color: #ccc; border: 1px solid #555; border-radius: 4px;
  }
  .toolbtn.active { background: #16a34a; color: #fff; border-color: #16a34a; }
  #ts { margin-top: 8px; }
  #ts svg { display: block; background: rgba(255,255,255,.04); border-radius: 3px; width: 100%; }
  #ts .tsstats { color: #ccc; font-size: 10px; margin-top: 2px; }
  #ts .tshint { color: #789; font-size: 10px; }
  #stats { color: #cde; font-size: 10px; margin-top: 4px; min-height: 1em; }
  #xarray {
    margin: 4px 0 0; padding: 5px 6px; background: #0c0c14; color: #9fd;
    font-size: 9.5px; line-height: 1.35; border-radius: 3px;
    white-space: pre; overflow-x: auto; max-height: 130px; overflow-y: auto;
  }
  #xarray:empty { display: none; }
</style>
</head>
<body>
<div id="map"></div>
<div id="panel">
  <b>MUR SST 1 km (Leaflet + WebGL)</b>
  <div id="meta">loading store…</div>
  <div id="warn"></div>
  <label>variable
    <select id="varsel"></select>
  </label>
  <label>basemap
    <select id="basemap">
      <option value="dark">dark (Carto)</option>
      <option value="gebco">GEBCO bathymetry</option>
      <option value="esri">ESRI Ocean (labels)</option>
    </select>
  </label>
  <label>colormap
    <select id="cmap"></select>
  </label>
  <div class="row">
    <label>min (K) <input id="cmin" type="number" step="0.05" /></label>
    <label>max (K) <input id="cmax" type="number" step="0.05" /></label>
  </div>
  <label>opacity <span id="opval">100%</span>
    <input id="opacity" type="range" min="0" max="1" step="0.05" value="1" />
  </label>
  <label>day <span id="slicelabel"></span>
    <input id="slice" type="range" min="0" max="61" step="1" value="0" />
  </label>
  <div class="row" id="tools">
    <button type="button" id="btn-chart" class="toolbtn">Start charting</button>
  </div>
  <div id="readout">click map for value</div>
  <div id="ts"></div>
  <div id="stats"></div>
  <pre id="xarray"></pre>
</div>
<script type="importmap">{"imports":{"leaflet":"https://esm.sh/leaflet@1.9.4","zarrita":"https://esm.sh/zarrita@0.7.3"}}</script>
<script type="module">
import L from 'leaflet'
import * as zarr from 'zarrita'
// Colormaps only -- the layer itself has no zarr-maps dependency.
import { colormapBuilder } from './zarr-maps/index.js'
import { ZarrGLLayer } from './zarr-gl/zarr-gl-layer.js'

window.onerror = (m, s, l, c, e) => console.error('ERROR:', m, e?.stack ?? '')
window.onunhandledrejection = (e) => console.error('REJECTION:', e.reason?.stack ?? e.reason)

const el = (id) => document.getElementById(id)

const VARS = {
  analysed_sst: {
    clim: [271.15, 305.15], cmap: 'jet', units: '°C', label: 'SST', kind: 'absolute',
  },
  sst_anomaly: {
    clim: [-3, 3], cmap: 'RdBu_r', units: '°C', label: 'SST anomaly', kind: 'delta',
  },
}
const COLORMAP_NAMES = [
  'jet', 'turbo', 'plasma', 'viridis', 'magma', 'inferno', 'cividis',
  'RdBu', 'RdBu_r', 'coolwarm', 'seismic', 'Spectral', 'RdYlBu',
  'Greys', 'Greys_r', 'YlOrRd', 'YlGnBu',
]

const DEFAULT_STORE = 'https://d1ef9node0gwi2.cloudfront.net/mur1km_nov-dec-2025_int16_pyramid.zarr'
const resolveSource = (store) => /^https?:\/\//.test(store) ? store : new URL(store, location.href).href

const params = new URLSearchParams(location.search)
const source = resolveSource(params.get('store') ?? DEFAULT_STORE)
let cur = params.get('var') in VARS ? params.get('var') : 'analysed_sst'

const metaEl = el('meta'), warnEl = el('warn'), readoutEl = el('readout')
const varSel = el('varsel'), cmapSel = el('cmap'), cminInput = el('cmin'), cmaxInput = el('cmax')
const opacitySlider = el('opacity'), opVal = el('opval')
const sliceSlider = el('slice'), sliceLabel = el('slicelabel')

for (const v of Object.keys(VARS)) varSel.add(new Option(`${VARS[v].label} (${v})`, v))
for (const name of COLORMAP_NAMES) cmapSel.add(new Option(name, name))
varSel.value = cur

const map = L.map('map', { center: [20, -45], zoom: 2 })

// ---------- basemaps (data layer lives in the overlay pane, above these) ----------
const BASEMAPS = {
  dark: () => [
    L.tileLayer('https://basemaps.cartocdn.com/dark_all/{z}/{x}/{y}.png', {
      maxZoom: 12, attribution: '&copy; OpenStreetMap contributors &copy; CARTO' }),
  ],
  gebco: () => [
    L.tileLayer.wms('https://wms.gebco.net/mapserv?', {
      layers: 'GEBCO_LATEST', format: 'image/jpeg', version: '1.3.0',
      attribution: 'GEBCO Compilation Group' }),
  ],
  esri: () => [
    L.tileLayer('https://services.arcgisonline.com/ArcGIS/rest/services/Ocean/World_Ocean_Base/MapServer/tile/{z}/{y}/{x}', {
      maxZoom: 13, attribution: 'Esri, GEBCO, NOAA, National Geographic, Garmin, HERE, and others' }),
    L.tileLayer('https://services.arcgisonline.com/ArcGIS/rest/services/Ocean/World_Ocean_Reference/MapServer/tile/{z}/{y}/{x}', {
      maxZoom: 13, attribution: 'Esri' }),
  ],
}
let baseLayers = []
function setBasemap(key) {
  for (const lyr of baseLayers) map.removeLayer(lyr)
  baseLayers = (BASEMAPS[key] ?? BASEMAPS.dark)()
  for (const lyr of baseLayers) lyr.addTo(map)
}
setBasemap('dark')
el('basemap').onchange = () => setBasemap(el('basemap').value)

const kToC = (k, kind) => kind === 'delta' ? k : k - 273.15

// ---------- zarrita side-channel: click -> value, and time-series charting ----------
const sideChannels = new Map()
const encCache = new Map()

async function ensureSideChannel(src) {
  if (!sideChannels.has(src)) sideChannels.set(src, { arrays: new Map(), grid: null, ready: null })
  const sc = sideChannels.get(src)
  if (!sc.ready) {
    sc.ready = (async () => {
      const store = await zarr.extendStore(
        new zarr.FetchStore(src, { overrides: { cache: 'no-store' } }),
        (s) => zarr.withMaybeConsolidatedMetadata(s, { format: 'v3' }).catch(() => s),
      )
      sc.root = zarr.root(store)
    })()
  }
  await sc.ready
  return sc
}

// Level-aware array open, cached by "<level>/<name>". Level 0 is full resolution.
async function getArray(sc, name, lvl = 0) {
  const key = `${lvl}/${name}`
  if (!sc.arrays.has(key)) {
    sc.arrays.set(key, zarr.open(sc.root.resolve(key), { kind: 'array' }))
  }
  return await sc.arrays.get(key)
}

async function getGrid(sc, lvl = 0) {
  const key = `grid${lvl}`
  if (!sc[key]) {
    sc[key] = (async () => {
      const [laArr, loArr] = await Promise.all([getArray(sc, 'latitude', lvl), getArray(sc, 'longitude', lvl)])
      const [la, lo] = await Promise.all([
        zarr.get(laArr, [zarr.slice(0, 2)]),
        zarr.get(loArr, [zarr.slice(0, 2)]),
      ])
      return {
        lat0: la.data[0], dlat: la.data[1] - la.data[0],
        lon0: lo.data[0], dlon: lo.data[1] - lo.data[0],
        ny: laArr.shape[0], nx: loArr.shape[0],
      }
    })()
  }
  return await sc[key]
}

async function getEncoding(src, variable) {
  if (!encCache.has(variable)) {
    encCache.set(variable, (async () => {
      const r = await fetch(`${src}/0/${variable}/zarr.json`, { cache: 'no-store' })
      const m = await r.json()
      const at = m.attributes ?? {}
      return {
        scale: at.scale_factor ?? 1,
        offset: at.add_offset ?? 0,
        fill: m.fill_value,
        packed: at.scale_factor !== undefined,
      }
    })())
  }
  return await encCache.get(variable)
}

const decodeRaw = (raw, enc) => {
  const n = Number(raw)
  if (!enc.packed) return n
  if (enc.fill != null && n === enc.fill) return NaN
  return n * enc.scale + enc.offset
}
const wrap180 = (lon) => ((lon + 180) % 360 + 360) % 360 - 180
const clampIdx = (v, hi) => Math.min(hi, Math.max(0, Math.round(v)))

async function readPointValue(src, variable, sliceIdx, lat, lon) {
  const sc = await ensureSideChannel(src)
  const [arr, g, enc] = await Promise.all([getArray(sc, variable), getGrid(sc), getEncoding(src, variable)])
  const y = clampIdx((lat - g.lat0) / g.dlat, g.ny - 1)
  const x = clampIdx((wrap180(lon) - g.lon0) / g.dlon, g.nx - 1)
  return decodeRaw(await zarr.get(arr, [sliceIdx, y, x]), enc)
}

// ---------- time series (coarse level: 62 time steps per point, kept small) ----------
const TS_LEVEL = 5
let clickSeq = 0
let lastPoint = null, lastSeries = null, lastSeriesVar = null

async function readSeries(variable, lat, lon) {
  const sc = await ensureSideChannel(source)
  const [arr, g, enc] = await Promise.all([
    getArray(sc, variable, TS_LEVEL), getGrid(sc, TS_LEVEL), getEncoding(source, variable),
  ])
  const y = clampIdx((lat - g.lat0) / g.dlat, g.ny - 1)
  const x = clampIdx((wrap180(lon) - g.lon0) / g.dlon, g.nx - 1)
  const col = await zarr.get(arr, [zarr.slice(null), y, x])   // raw
  return Array.from(col.data, (raw) => decodeRaw(raw, enc))   // physical kelvin / NaN
}

function renderSeries(box, valuesK, variable) {
  const cfg = VARS[variable]
  const vals = valuesK.map((k) => (k == null || Number.isNaN(k)) ? NaN : kToC(Number(k), cfg.kind))
  const fin = vals.filter(Number.isFinite)
  if (!fin.length) { box.innerHTML = '<div class="tshint">no time series at this point</div>'; return }
  const W = 224, H = 60, pad = 5
  const lo = Math.min(...fin), hi = Math.max(...fin), rng = (hi - lo) || 1
  const n = vals.length
  const X = (i) => pad + i * (W - 2 * pad) / Math.max(1, n - 1)
  const Y = (v) => pad + (H - 2 * pad) * (1 - (v - lo) / rng)
  let path = '', pen = false
  vals.forEach((v, i) => {
    if (Number.isFinite(v)) { path += `${pen ? 'L' : 'M'}${X(i).toFixed(1)} ${Y(v).toFixed(1)} `; pen = true }
    else pen = false
  })
  const ci = curSliceIdx
  const cm = Number.isFinite(vals[ci])
    ? `<circle cx="${X(ci).toFixed(1)}" cy="${Y(vals[ci]).toFixed(1)}" r="2.6" fill="#fd9"/>` : ''
  const zero = (lo < 0 && hi > 0)
    ? `<line x1="${pad}" y1="${Y(0).toFixed(1)}" x2="${W - pad}" y2="${Y(0).toFixed(1)}" stroke="#556" stroke-width="0.5" stroke-dasharray="2 2"/>` : ''
  const stroke = variable === 'sst_anomaly' ? '#f4a582' : '#60a5fa'
  box.innerHTML =
    `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">${zero}` +
    `<path d="${path}" fill="none" stroke="${stroke}" stroke-width="1.5"/>${cm}</svg>` +
    `<div class="tsstats">${cfg.label}: min ${lo.toFixed(2)} · max ${hi.toFixed(2)} ${cfg.units} · ${n} days · L${TS_LEVEL}</div>`
}

function seriesStats(valuesK, variable) {
  const cfg = VARS[variable]
  const v = valuesK.map((k) => Number.isFinite(k) ? kToC(Number(k), cfg.kind) : NaN).filter(Number.isFinite)
  if (!v.length) return ''
  const mean = v.reduce((p, q) => p + q, 0) / v.length
  return `series n=${v.length} · mean ${mean.toFixed(2)} · min ${Math.min(...v).toFixed(2)} · max ${Math.max(...v).toFixed(2)} ${cfg.units}`
}

function xarraySnippet(sel) {
  const url = source.replace(/\/$/, '')
  const kc = cur === 'analysed_sst' ? '   # Kelvin — subtract 273.15 for °C' : ''
  if (sel.type === 'point')
    return `import xarray as xr\nds = xr.open_zarr("${url}", group="0")   # 0 = full res\nda = ds["${cur}"]${kc}\nts = da.sel(latitude=${sel.lat.toFixed(4)}, longitude=${sel.lon.toFixed(4)},\n            method="nearest")\nts.plot()`
  return `import xarray as xr\nds = xr.open_zarr("${url}", group="0")   # 0 = full res\nda = ds["${cur}"]${kc}\n# lat slice follows store order (flip if empty)\nbox = da.sel(latitude=slice(${sel.n.toFixed(4)}, ${sel.s.toFixed(4)}),\n             longitude=slice(${sel.w.toFixed(4)}, ${sel.e.toFixed(4)}))\nseries = box.mean(("latitude", "longitude"))\nseries.plot()`
}

async function refreshSeries(lat, lon) {
  lastPoint = { lat, lon }
  const box = el('ts')
  const seq = ++clickSeq
  box.innerHTML = '<div class="tshint">loading time series…</div>'
  el('stats').textContent = ''; el('xarray').textContent = ''
  try {
    const series = await readSeries(cur, lat, lon)
    if (seq !== clickSeq) return              // superseded by a newer click
    lastSeries = series; lastSeriesVar = cur
    renderSeries(box, series, cur)
    el('stats').textContent = seriesStats(series, cur)
    el('xarray').textContent = xarraySnippet({ type: 'point', lat, lon })
  } catch (err) {
    console.error(err)
    if (seq === clickSeq) box.innerHTML = `<div class="tshint">series failed: ${err.message}</div>`
  }
}

async function chartBox(w, s, e, n) {
  const box = el('ts')
  box.innerHTML = '<div class="tshint">reading box…</div>'
  el('stats').textContent = ''; el('xarray').textContent = ''
  const seq = ++clickSeq
  try {
    const sc = await ensureSideChannel(source)
    const [arr, g, enc] = await Promise.all([
      getArray(sc, cur, TS_LEVEL), getGrid(sc, TS_LEVEL), getEncoding(source, cur),
    ])
    const xi = (lon) => clampIdx((wrap180(lon) - g.lon0) / g.dlon, g.nx - 1)
    const yi = (lat) => clampIdx((lat - g.lat0) / g.dlat, g.ny - 1)
    let x0 = xi(w), x1 = xi(e); if (x0 > x1) [x0, x1] = [x1, x0]
    let y0 = yi(n), y1 = yi(s); if (y0 > y1) [y0, y1] = [y1, y0]   // lat may descend
    x1 = Math.min(g.nx, x1 + 1); y1 = Math.min(g.ny, y1 + 1)
    const cube = await zarr.get(arr, [zarr.slice(null), zarr.slice(y0, y1), zarr.slice(x0, x1)])
    if (seq !== clickSeq) return
    const [T, Hc, Wc] = cube.shape, HW = Hc * Wc, cfg = VARS[cur]
    const seriesK = []
    for (let t = 0; t < T; t++) {
      let sum = 0, c = 0
      for (let k = 0; k < HW; k++) { const v = decodeRaw(cube.data[t * HW + k], enc); if (Number.isFinite(v)) { sum += v; c++ } }
      seriesK.push(c ? sum / c : NaN)
    }
    lastSeries = seriesK; lastSeriesVar = cur; lastPoint = null
    renderSeries(box, seriesK, cur)
    const ci = curSliceIdx, day = []
    for (let k = 0; k < HW; k++) { const v = decodeRaw(cube.data[ci * HW + k], enc); if (Number.isFinite(v)) day.push(kToC(v, cfg.kind)) }
    if (day.length) {
      const mean = day.reduce((p, q) => p + q, 0) / day.length
      const sd = Math.sqrt(day.reduce((p, q) => p + (q - mean) ** 2, 0) / day.length)
      el('stats').textContent = `box ${Hc}×${Wc}px (L${TS_LEVEL}) · ${slices[ci]?.date ?? `index ${ci}`}: ` +
        `mean ${mean.toFixed(2)} · sd ${sd.toFixed(2)} · min ${Math.min(...day).toFixed(2)} · max ${Math.max(...day).toFixed(2)} ${cfg.units}`
    }
    el('xarray').textContent = xarraySnippet({ type: 'box', w, s, e, n })
  } catch (err) {
    console.error(err)
    if (seq === clickSeq) box.innerHTML = `<div class="tshint">box read failed: ${err.message}</div>`
  }
}

// ---------- day slider ----------
let slices = []
let curSliceIdx = 0

function updateSliceLabel() {
  sliceLabel.textContent = slices[curSliceIdx]?.date ?? `index ${curSliceIdx}`
}

async function buildFallbackSlider() {
  try {
    const sc = await ensureSideChannel(source)
    const arr = await getArray(sc, cur)
    const n = arr.shape[0]
    sliceSlider.min = 0; sliceSlider.max = Math.max(0, n - 1); sliceSlider.step = 1; sliceSlider.value = 0
  } catch (err) {
    console.error('fallback slider shape lookup failed', err)
    sliceSlider.min = 0; sliceSlider.max = 0; sliceSlider.step = 1; sliceSlider.value = 0
  }
  curSliceIdx = 0
  updateSliceLabel()
}

function buildSliderFromSlices() {
  sliceSlider.min = 0
  sliceSlider.max = Math.max(0, slices.length - 1)
  sliceSlider.step = 1
  sliceSlider.value = 0
  curSliceIdx = 0
  updateSliceLabel()
}

// ---------- layer lifecycle ----------
let layer = null
let curOpacity = 1
let layerOpId = 0

const rampFor = (name) => colormapBuilder(name)

function destroyLayer() {
  if (layer) { map.removeLayer(layer); layer = null }
}

async function createLayer() {
  const opId = ++layerOpId
  destroyLayer()
  await new Promise((r) => requestAnimationFrame(r))
  if (opId !== layerOpId) return

  const newLayer = new ZarrGLLayer({
    url: source,
    variable: cur,
    maxZoom: 12,
    clim: [parseFloat(cminInput.value), parseFloat(cmaxInput.value)],
    colors: rampFor(cmapSel.value),
    opacity: curOpacity,
    selectors: { time: curSliceIdx },
  })
  layer = newLayer
  newLayer.addTo(map)
  try {
    await newLayer.readyPromise
    if (opId !== layerOpId) { try { map.removeLayer(newLayer) } catch {} ; return }
    updateMeta()
  } catch (err) {
    if (opId !== layerOpId) return
    warnEl.textContent = 'layer load error (see console)'
    console.error(err)
  }
}

function updateMeta() {
  const levels = layer?.source?.levels ?? []
  const detail = levels.length ? ` — ${levels.length} levels` : ''
  metaEl.textContent = `MUR SST 1 km — ${VARS[cur].label} (${cur})${detail}`
}

function setVarDefaults() {
  const cfg = VARS[cur]
  cmapSel.value = cfg.cmap
  cminInput.value = cfg.clim[0]
  cmaxInput.value = cfg.clim[1]
}

async function loadStoreAndLayer() {
  destroyLayer()
  metaEl.textContent = 'loading store…'
  warnEl.textContent = ''
  slices = []
  curSliceIdx = 0
  try {
    const r = await fetch(`${source}/slices.json`, { cache: 'no-store' })
    if (!r.ok) throw new Error(`slices.json ${r.status}`)
    slices = await r.json()
    buildSliderFromSlices()
  } catch (err) {
    console.error('slices.json missing/failed', err)
    warnEl.textContent = 'slices.json missing — falling back to index-only slider'
    await buildFallbackSlider()
  }
  createLayer()
  updateMeta()
}

// ---------- control wiring ----------
varSel.onchange = () => {
  cur = varSel.value
  setVarDefaults()
  createLayer()
  updateMeta()
  if (lastPoint) refreshSeries(lastPoint.lat, lastPoint.lon)   // re-read series for new var
}

cmapSel.onchange = () => {
  if (layer) layer.updateStyle({ colors: rampFor(cmapSel.value) })
}

function applyClim() {
  const lo = parseFloat(cminInput.value)
  const hi = parseFloat(cmaxInput.value)
  if (!Number.isFinite(lo) || !Number.isFinite(hi) || lo >= hi) {
    warnEl.textContent = 'invalid clim range (min must be < max)'
    return
  }
  if (warnEl.textContent.startsWith('invalid clim')) warnEl.textContent = ''
  if (layer) layer.updateStyle({ clim: [lo, hi] })
}
cminInput.onchange = applyClim
cmaxInput.onchange = applyClim

opacitySlider.oninput = () => {
  curOpacity = parseFloat(opacitySlider.value)
  opVal.textContent = `${Math.round(curOpacity * 100)}%`
  if (layer) layer.updateStyle({ opacity: curOpacity })
}

let sliceTimer
sliceSlider.oninput = () => {
  curSliceIdx = +sliceSlider.value
  updateSliceLabel()
  if (lastSeries && lastSeriesVar === cur) renderSeries(el('ts'), lastSeries, cur)  // move marker, no fetch
  clearTimeout(sliceTimer)
  sliceTimer = setTimeout(() => {
    if (layer) layer.updateSelectors({ time: curSliceIdx })
  }, 80)
}

// ---------- charting mode: click a point or drag a box -> series + stats + xarray ----------
const btnChart = el('btn-chart')
let chartMode = false, downPt = null, downLL = null, boxRect = null

function setBox(latlngs) {
  if (!latlngs) { if (boxRect) { map.removeLayer(boxRect); boxRect = null } return }
  const b = L.latLngBounds(latlngs)
  if (boxRect) boxRect.setBounds(b)
  else boxRect = L.rectangle(b, { color: '#fde047', weight: 1.5, fillColor: '#fde047', fillOpacity: 0.12 }).addTo(map)
}

btnChart.onclick = () => {
  chartMode = !chartMode
  btnChart.textContent = chartMode ? 'Stop charting' : 'Start charting'
  btnChart.classList.toggle('active', chartMode)
  map.getContainer().style.cursor = chartMode ? 'crosshair' : ''
  if (chartMode) map.dragging.disable()
  else { map.dragging.enable(); setBox(null) }
}

map.on('mousedown', (e) => { if (chartMode) { downPt = e.containerPoint; downLL = e.latlng } })
map.on('mousemove', (e) => { if (chartMode && downPt) setBox([downLL, e.latlng]) })
map.on('mouseup', (e) => {
  if (!chartMode || !downPt) return
  const moved = downPt.distanceTo(e.containerPoint)
  const a = downLL, b = e.latlng
  downPt = null
  if (moved < 6) { setBox(null); refreshSeries(a.lat, a.lng) }        // tap = point
  else chartBox(Math.min(a.lng, b.lng), Math.min(a.lat, b.lat), Math.max(a.lng, b.lng), Math.max(a.lat, b.lat))
})

// ---------- click readout (+ time series when not box-charting) ----------
map.on('click', async (e) => {
  const { lat, lng } = e.latlng
  const where = `${lat.toFixed(3)}, ${lng.toFixed(3)}`
  readoutEl.textContent = `${where}: reading…`
  try {
    const v = await readPointValue(source, cur, curSliceIdx, lat, lng)
    if (v == null || Number.isNaN(v)) {
      readoutEl.textContent = `${where}: no data`
    } else {
      const cfg = VARS[cur]
      const c = kToC(v, cfg.kind)
      const day = slices[curSliceIdx]?.date ?? `index ${curSliceIdx}`
      const cStr = cfg.kind === 'delta' ? `${c >= 0 ? '+' : ''}${c.toFixed(2)}` : c.toFixed(2)
      readoutEl.textContent = `${where}: ${v.toFixed(3)} K (${cStr} °C) — ${cfg.label} (${day})`
    }
  } catch (err) {
    console.error(err)
    readoutEl.textContent = `${where}: lookup failed (see console)`
  }
  if (!chartMode) refreshSeries(lat, lng)   // box drags are handled in mouseup
})

// ---------- boot ----------
setVarDefaults()
loadStoreAndLayer()

window.__mur = {
  readPointValue,
  readSeries,
  get layer() { return layer },
  get source() { return source },
  get cur() { return cur },
  get curSliceIdx() { return curSliceIdx },
}
window.__leafletMap = map
</script>
</body>
</html>
