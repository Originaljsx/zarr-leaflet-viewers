<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>SWOT Arctic (EPSG:3413) — Leaflet + WebGL</title>
<link rel="stylesheet" href="https://esm.sh/leaflet@1.9.4/dist/leaflet.css" />
<style>
  body { margin: 0; font-family: monospace; background: #05070d; }
  #map { position: absolute; inset: 0; background: #05070d; }
  #panel {
    position: absolute; top: 10px; left: 10px; z-index: 1000;
    background: rgba(0,0,0,.78); color: #eee; padding: 10px 12px;
    border-radius: 6px; font-size: 12px; width: 250px;
  }
  #panel label { display: block; margin-top: 8px; }
  #panel select, #panel input[type=number] { width: 100%; box-sizing: border-box; }
  #panel .row { display: flex; gap: 6px; }
  #panel .row label { flex: 1; }
  #meta { margin-top: 6px; color: #aaa; min-height: 1em; }
  #warn { margin-top: 4px; color: #fc6; min-height: 0; }
  #warn:empty { display: none; }
  #readout { margin-top: 8px; color: #9fd; min-height: 1em; }
  .modebtn {
    flex: 1; padding: 4px 0; font: inherit; font-size: 12px; cursor: pointer;
    background: #222; color: #ccc; border: 1px solid #555; border-radius: 4px;
  }
  .modebtn.active { background: #2563eb; color: #fff; border-color: #2563eb; }
  input[type=range] { width: 100%; }
  /* dual-thumb min/max: two range inputs stacked on one track */
  .dual { position: relative; height: 30px; margin-top: 4px; }
  .dual input[type=range] {
    position: absolute; left: 0; top: 8px; margin: 0; width: 100%;
    -webkit-appearance: none; appearance: none; background: none; pointer-events: none;
  }
  .dual input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none; pointer-events: auto;
    height: 14px; width: 14px; border-radius: 50%; background: #2563eb;
    border: 2px solid #fff; cursor: pointer; margin-top: 0;
  }
  .dual input[type=range]::-moz-range-thumb {
    pointer-events: auto; height: 14px; width: 14px; border-radius: 50%;
    background: #2563eb; border: 2px solid #fff; cursor: pointer;
  }
  .dual .track { position: absolute; left: 0; right: 0; top: 13px; height: 4px;
    background: #444; border-radius: 2px; }
  .dual .fill { position: absolute; top: 13px; height: 4px; background: #2563eb;
    border-radius: 2px; }
  .climval { display: flex; justify-content: space-between; color: #ccc; font-size: 11px; }
  /* bottom timeline (ported from the maplibre icechunk viewer) */
  #timeline {
    position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%);
    width: min(78%, 920px); z-index: 1000; display: none;
    background: rgba(0,0,0,.78); border-radius: 6px; padding: 8px 10px 6px;
    font-family: monospace; color: #ccc; font-size: 11px;
  }
  .tl-row { display: flex; gap: 2px; margin-top: 3px; }
  .tl-row:first-child { margin-top: 0; }
  .tl-cell {
    flex: 1; text-align: center; border-radius: 2px; padding: 2px 0;
    background: #262626; color: #666; user-select: none; font-size: 10px;
  }
  .tl-cell.has-data { background: #34506e; color: #d6e4f0; cursor: pointer; }
  .tl-cell.has-data:hover { background: #47688c; }
  .tl-cell.active { background: #2563eb; color: #fff; }
  #tl-label { display: flex; justify-content: space-between; margin-top: 5px; }
  #tl-date { color: #9fd; }
  #tl-hint { color: #777; font-size: 10px; }
</style>
</head>
<body>
<div id="map"></div>
<div id="panel">
  <b>SWOT Arctic σ0 (EPSG:3413)</b>
  <div id="meta">loading store…</div>
  <div id="warn"></div>

  <div class="row" style="margin-top:8px;">
    <button type="button" id="mode-pass" class="modebtn active">Pass</button>
    <button type="button" id="mode-day" class="modebtn">Day</button>
    <button type="button" id="mode-cycle" class="modebtn">Cycle</button>
  </div>

  <label>day <span id="daylabel"></span>
    <input id="day" type="range" min="0" max="0" step="1" value="0" />
  </label>
  <label id="passrow">pass
    <select id="passsel"></select>
  </label>

  <label>colormap
    <select id="cmap"></select>
  </label>

  <label>range</label>
  <div class="row">
    <label>min <input id="cminNum" type="number" step="0.5" /></label>
    <label>max <input id="cmaxNum" type="number" step="0.5" /></label>
  </div>
  <div class="dual" id="dual">
    <div class="track"></div><div class="fill" id="dualfill"></div>
    <input id="cmin" type="range" />
    <input id="cmax" type="range" />
  </div>
  <label style="display:flex;align-items:center;gap:6px;margin-top:8px;">
    <input id="logscale" type="checkbox" style="width:auto;" /> log scale
  </label>

  <label>data opacity <span id="opval">100%</span>
    <input id="opacity" type="range" min="0" max="1" step="0.05" value="1" />
  </label>
  <label>basemap
    <select id="basemap"></select>
  </label>

  <div id="readout">click swath for σ0 value</div>
</div>

<div id="timeline">
  <div id="tl-rows"></div>
  <div id="tl-label"><span id="tl-date"></span><span id="tl-hint">&#8592; &#8594; change day</span></div>
</div>

<script type="importmap">{"imports":{
  "leaflet":"https://esm.sh/leaflet@1.9.4",
  "zarrita":"https://esm.sh/zarrita@0.7.3",
  "proj4":"https://esm.sh/proj4@2.15.0",
  "icechunk-js":"https://esm.sh/icechunk-js@0.6.0"
}}</script>
<script type="module">
import L from 'leaflet'
import proj4 from 'proj4'
// ?v= cache-buster: python http.server serves modules cacheable, so a bare
// refresh can keep stale zarr-gl/zarr-maps JS. Bump on edits.
import { colormapBuilder } from './zarr-maps/index.js?v=3'
import { ZarrGLLayer } from './zarr-gl/zarr-gl-layer.js?v=3'
import * as zarr from 'zarrita'
import { IcechunkStore } from 'icechunk-js'

window.onerror = (m, s, l, c, e) => console.error('ERROR:', m, e?.stack ?? '')
window.onunhandledrejection = (e) => console.error('REJECTION:', e.reason?.stack ?? e.reason)
const el = (id) => document.getElementById(id)

/* ---------- EPSG:3413 as a Leaflet CRS (no proj4leaflet, single L instance) ---------- */
const EXTENT = 4194304
const DEF3413 = '+proj=stere +lat_0=90 +lat_ts=70 +lon_0=-45 +k=1 +x_0=0 +y_0=0 +datum=WGS84 +units=m +no_defs'
const pj = proj4('EPSG:4326', DEF3413)
const RESOLUTIONS = [8192, 4096, 2048, 1024, 512, 256, 128, 64]  // m/px z0..7 (z == GIBS matrix)
const SCALES = RESOLUTIONS.map((r) => 1 / r)
const CRS3413 = L.Util.extend({}, L.CRS.Earth, {
  code: 'EPSG:3413', infinite: false, wrapLng: false, wrapLat: false,
  projection: {
    project(latlng) { const [x, y] = pj.forward([latlng.lng, latlng.lat]); return new L.Point(x, y) },
    unproject(point) { const [lng, lat] = pj.inverse([point.x, point.y]); return L.latLng(lat, lng) },
    bounds: L.bounds([-EXTENT, -EXTENT], [EXTENT, EXTENT]),
  },
  transformation: new L.Transformation(1, EXTENT, -1, EXTENT),
  scale(zoom) {
    const i = Math.floor(zoom)
    if (zoom === i || i + 1 >= SCALES.length) return SCALES[Math.min(i, SCALES.length - 1)]
    return SCALES[i] + (SCALES[i + 1] - SCALES[i]) * (zoom - i)
  },
  zoom(scale) {
    for (let i = 0; i < SCALES.length - 1; i++) {
      if (scale <= SCALES[i]) return i
      if (scale < SCALES[i + 1]) return i + (scale - SCALES[i]) / (SCALES[i + 1] - SCALES[i])
    }
    return SCALES.length - 1
  },
})

/* ---------- config ---------- */
const params = new URLSearchParams(location.search)
const source = params.get('store') ?? 'https://d1ef9node0gwi2.cloudfront.net/ice/arctic3413_250m_c43.icechunk'
const VAR = params.get('var') ?? 'sig0'   // this store carries sig0 only
const COLORMAP_NAMES = ['bone', 'Greys', 'Greys_r', 'viridis', 'turbo', 'plasma', 'magma',
  'inferno', 'cividis', 'RdBu', 'RdBu_r', 'Spectral', 'YlOrRd', 'YlGnBu']
const CLIM_RANGE = [0, 300]   // slider bounds; typed inputs clamp to this too
let clim = [1, 100]

const metaEl = el('meta'), warnEl = el('warn'), readoutEl = el('readout')

/* ---------- map + GIBS 3413 basemaps ---------- */
const map = L.map('map', { crs: CRS3413, center: [90, 0], zoom: 2, maxZoom: 7, minZoom: 0 })
const gibs = (layer, set, ext, maxNative, time = 'default') =>
  L.tileLayer(
    `https://gibs.earthdata.nasa.gov/wmts/epsg3413/best/${layer}/default/${time}/${set}/{z}/{y}/{x}.${ext}`,
    { tileSize: 512, minZoom: 0, maxZoom: 7, maxNativeZoom: maxNative, noWrap: true,
      bounds: L.latLngBounds([[40, -180], [90, 180]]), attribution: 'Imagery &copy; NASA GIBS' })
// basemap options: builder returns the base tile layer for the current day date.
const BASEMAPS = {
  bluemarble: { label: 'Blue Marble', build: () => gibs('BlueMarble_NextGeneration', '500m', 'jpeg', 4) },
  modis: { label: 'MODIS True Color (daily)', dateDriven: true,
    build: (date) => gibs('MODIS_Terra_CorrectedReflectance_TrueColor', '250m', 'jpeg', 5, date) },
  none: { label: 'Coastline only (dark)', build: () => null },
}
for (const [k, v] of Object.entries(BASEMAPS)) el('basemap').add(new Option(v.label, k))
let baseKey = params.get('basemap') in BASEMAPS ? params.get('basemap') : 'bluemarble'
el('basemap').value = baseKey
const coastlines = gibs('Coastlines_15m', '250m', 'png', 5).addTo(map)
let baseLayer = null
function setBasemap() {
  if (baseLayer) { map.removeLayer(baseLayer); baseLayer = null }
  baseLayer = BASEMAPS[baseKey].build(currentDate())
  if (baseLayer) { baseLayer.addTo(map); baseLayer.bringToBack() }
}
el('basemap').onchange = () => { baseKey = el('basemap').value; setBasemap() }

/* ---------- store side-channel: time coord -> slices, and click -> value ---------- */
let iceStore = null, iceRoot = null
const arrCache = new Map()
async function ensureStore() {
  if (!iceStore) { iceStore = await IcechunkStore.open(source); iceRoot = zarr.root(iceStore) }
  return iceRoot
}
async function getArr(path) {
  if (!arrCache.has(path)) arrCache.set(path, zarr.open(iceRoot.resolve(path), { kind: 'array' }))
  return await arrCache.get(path)
}

// slices derived from the `time` coord (no slices.json in this store).
let slices = []          // [{ i, ms, date 'YYYY-MM-DD', hhmm }]
let days = []            // sorted unique dates; index == sig0_day / sig0_cyc day index
let dayPasses = new Map()  // date -> [slice, ...]

function parseEpoch(units) {
  const m = units.match(/since (\d+)-(\d+)-(\d+)[ T](\d+):(\d+):(\d+)/)
  if (!m) return 0
  return Date.UTC(+m[1], +m[2] - 1, +m[3], +m[4], +m[5], +m[6])
}
const isoDate = (ms) => new Date(ms).toISOString().slice(0, 10)
const hhmm = (ms) => new Date(ms).toISOString().slice(11, 16)

async function buildSlices() {
  await ensureStore()
  const tArr = await getArr(`0/time`)
  const t = await zarr.get(tArr)
  const T0 = parseEpoch(tArr.attrs?.units ?? '')
  slices = Array.from(t.data, (sec, i) => {
    const ms = T0 + Number(sec) * 1000
    return { i, ms, date: isoDate(ms), hhmm: hhmm(ms) }
  })
  const seen = new Set()
  for (const s of slices) {
    if (!seen.has(s.date)) { seen.add(s.date); days.push(s.date); dayPasses.set(s.date, []) }
    dayPasses.get(s.date).push(s)
  }
}

/* ---------- grid lookup for click readout (3413 metres -> row/col) ---------- */
let grid = null
async function getGrid() {
  if (!grid) {
    const [xa, ya] = await Promise.all([getArr(`0/x`), getArr(`0/y`)])
    const [x, y] = await Promise.all([zarr.get(xa, [zarr.slice(0, 2)]), zarr.get(ya, [zarr.slice(0, 2)])])
    grid = { x0: x.data[0], dx: x.data[1] - x.data[0], nx: xa.shape[0],
             y0: y.data[0], dy: y.data[1] - y.data[0], ny: ya.shape[0] }
  }
  return grid
}
const clampI = (v, hi) => Math.min(hi, Math.max(0, Math.round(v)))

async function readValue(varName, sliceDim, sliceIdx, latlng) {
  await ensureStore()
  const g = await getGrid()
  const pt = CRS3413.projection.project(latlng)   // metres
  const col = clampI((pt.x - g.x0) / g.dx, g.nx - 1)
  const row = clampI((pt.y - g.y0) / g.dy, g.ny - 1)
  const arr = await getArr(`0/${varName}`)
  const out = await zarr.get(arr, [sliceIdx, row, col])
  return Number(out.data ? out.data[0] : out)
}

/* ---------- mode / selection state ---------- */
let mode = ['pass', 'day', 'cycle'].includes(params.get('mode')) ? params.get('mode') : 'day'
let dayIdx = 0
let passI = 0          // time index for pass mode

// { variable, selectorDim, sliceIdx } for the current controls
function currentSpec() {
  if (mode === 'day') return { variable: `${VAR}_day`, dim: 'day', idx: dayIdx }
  if (mode === 'cycle') return { variable: `${VAR}_cyc`, dim: 'cyc', idx: 0 }
  return { variable: VAR, dim: 'time', idx: passI }   // pass
}
function currentDate() {
  if (mode === 'cycle') return days[0] ?? 'default'
  if (mode === 'day') return days[dayIdx] ?? 'default'
  return slices[passI]?.date ?? 'default'
}

/* ---------- data layer ---------- */
let layer = null, layerVar = null, layerOpId = 0
async function rebuildLayer() {
  const spec = currentSpec()
  const opId = ++layerOpId
  if (layer) { map.removeLayer(layer); layer = null }
  await new Promise((r) => requestAnimationFrame(r))
  if (opId !== layerOpId) return
  layerVar = spec.variable
  layer = new ZarrGLLayer({
    url: source, variable: spec.variable, geographic: false, tileSize: 512, maxZoom: 7,
    clim, colors: colormapBuilder(el('cmap').value), logScale: el('logscale').checked,
    opacity: parseFloat(el('opacity').value),
    selectors: { [spec.dim]: spec.idx },
  }).addTo(map)
  layer.readyPromise.then(() => { if (opId === layerOpId) updateMeta() },
    (err) => { warnEl.textContent = 'layer load error (see console)'; console.error(err) })
}
function applySelector() {
  const spec = currentSpec()
  if (!layer || layerVar !== spec.variable) { rebuildLayer(); return }
  layer.updateSelectors({ [spec.dim]: spec.idx })
  updateMeta()
}
function updateMeta() {
  const n = layer?.source?.levels?.length ?? 0
  metaEl.textContent = `${VAR} · ${mode} · ${currentDate()}` +
    (mode === 'pass' && slices[passI] ? ` ${slices[passI].hhmm}Z` : '') + ` · ${n} levels`
}

/* ---------- controls ---------- */
function syncModeButtons() {
  for (const m of ['pass', 'day', 'cycle']) el(`mode-${m}`).classList.toggle('active', mode === m)
  el('passrow').style.display = mode === 'pass' ? '' : 'none'
  el('day').disabled = mode === 'cycle'
}
function rebuildPassSelect() {
  const sel = el('passsel'); sel.innerHTML = ''
  for (const s of (dayPasses.get(days[dayIdx]) ?? [])) sel.add(new Option(`${s.hhmm}Z (pass ${s.i})`, s.i))
  // keep passI within this day; default to first pass of the day
  const passes = dayPasses.get(days[dayIdx]) ?? []
  if (!passes.some((s) => s.i === passI)) passI = passes[0]?.i ?? 0
  sel.value = passI
}
function updateDayLabel() { el('daylabel').textContent = days.length ? `${days[dayIdx]} (${dayIdx + 1}/${days.length})` : '' }

function setMode(m) {
  mode = m; syncModeButtons()
  if (mode === 'pass') rebuildPassSelect()
  updateDayLabel(); syncTimeline(); setBasemap(); rebuildLayer()
}
for (const m of ['pass', 'day', 'cycle']) el(`mode-${m}`).onclick = () => setMode(m)

el('day').oninput = () => {
  dayIdx = +el('day').value; updateDayLabel(); updateTimeline()
  if (mode === 'pass') { rebuildPassSelect() }
  if (BASEMAPS[baseKey].dateDriven) setBasemap()
  applySelector()
}
el('passsel').onchange = () => { passI = +el('passsel').value; if (BASEMAPS[baseKey].dateDriven) setBasemap(); applySelector() }

/* ---------- bottom timeline (ported from the maplibre icechunk viewer) ---------- */
const MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July',
  'August', 'September', 'October', 'November', 'December']
const fmtDate = (iso) => { if (!iso) return ''; const [y, m, d] = iso.split('-'); return `${MONTHS[+m - 1]} ${+d}, ${y}` }
function setDay(i) {
  i = Math.min(days.length - 1, Math.max(0, i))
  el('day').value = i
  el('day').dispatchEvent(new Event('input'))
}
function tlCell(text, cls, onclick, title) {
  const c = document.createElement('div')
  c.className = `tl-cell ${cls}`.trim(); c.textContent = text
  if (title) c.title = title
  if (onclick) c.onclick = onclick
  return c
}
function updateTimeline() {
  const rows = el('tl-rows'); rows.innerHTML = ''
  if (!days.length) return
  const cur = days[+el('day').value]; const [cy, cm] = cur.split('-')
  const years = [...new Set(days.map((d) => d.slice(0, 4)))]
  const months = [...new Set(days.map((d) => d.slice(0, 7)))]   // 'YYYY-MM'
  if (years.length > 1) {
    const r = document.createElement('div'); r.className = 'tl-row'
    for (const y of years) r.appendChild(tlCell(y, `has-data${y === cy ? ' active' : ''}`,
      () => setDay(days.findIndex((d) => d.startsWith(y)))))
    rows.appendChild(r)
  }
  const rm = document.createElement('div'); rm.className = 'tl-row'
  for (const ym of months) {
    const [y, m] = ym.split('-')
    rm.appendChild(tlCell(`${MONTHS[+m - 1].slice(0, 3)} ${y}`,
      `has-data${ym === `${cy}-${cm}` ? ' active' : ''}`,
      () => setDay(days.findIndex((d) => d.startsWith(ym)))))
  }
  rows.appendChild(rm)
  const rd = document.createElement('div'); rd.className = 'tl-row'
  const nd = new Date(+cy, +cm, 0).getDate()      // days in current month
  for (let d = 1; d <= nd; d++) {
    const iso = `${cy}-${cm}-${String(d).padStart(2, '0')}`
    const idx = days.indexOf(iso)
    rd.appendChild(tlCell(String(d), idx < 0 ? '' : `has-data${iso === cur ? ' active' : ''}`,
      idx < 0 ? null : () => setDay(idx), idx < 0 ? 'no data' : fmtDate(iso)))
  }
  rows.appendChild(rd)
  el('tl-date').textContent = fmtDate(cur)
}
function syncTimeline() {
  el('timeline').style.display = (mode === 'day' && days.length) ? 'block' : 'none'
  updateTimeline()
}
// arrow keys step the day in day mode (unless a form control is focused)
document.addEventListener('keydown', (e) => {
  if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return
  const t = document.activeElement?.tagName
  if (t === 'INPUT' || t === 'SELECT' || t === 'TEXTAREA') return
  if (mode !== 'day') return
  e.preventDefault()
  setDay(+el('day').value + (e.key === 'ArrowRight' ? 1 : -1))
})

/* colormap + log + opacity */
el('cmap').onchange = () => { layer?.updateStyle({ colors: colormapBuilder(el('cmap').value) }); renderClimUI() }
el('logscale').onchange = () => layer?.updateStyle({ logScale: el('logscale').checked })
el('opacity').oninput = () => {
  el('opval').textContent = `${Math.round(parseFloat(el('opacity').value) * 100)}%`
  layer?.updateStyle({ opacity: parseFloat(el('opacity').value) })
}

/* min/max: dual-thumb slider + typed inputs, colormap gradient on the track */
const cmin = el('cmin'), cmax = el('cmax'), cminNum = el('cminNum'), cmaxNum = el('cmaxNum')
const clampC = (v) => Math.max(CLIM_RANGE[0], Math.min(CLIM_RANGE[1], v))

function cssGradient(name) {
  const cols = colormapBuilder(name), n = cols.length
  const stops = cols.map((c, i) => {
    const s = (c[0] <= 1 && c[1] <= 1 && c[2] <= 1) ? 255 : 1
    return `rgb(${Math.round(c[0] * s)},${Math.round(c[1] * s)},${Math.round(c[2] * s)}) ${(i / (n - 1) * 100).toFixed(1)}%`
  })
  return `linear-gradient(to right, ${stops.join(',')})`
}
function renderClimUI() {
  const [lo, hi] = clim, span = CLIM_RANGE[1] - CLIM_RANGE[0], fill = el('dualfill')
  cmin.value = lo; cmax.value = hi; cminNum.value = lo; cmaxNum.value = hi
  fill.style.left = `${((lo - CLIM_RANGE[0]) / span) * 100}%`
  fill.style.width = `${((hi - lo) / span) * 100}%`
  fill.style.background = cssGradient(el('cmap').value)   // colorbar coloured by the active map
}
function setClim(lo, hi) {
  lo = clampC(lo); hi = clampC(hi)
  if (lo > hi) [lo, hi] = [hi, lo]
  clim = [lo, hi]; renderClimUI(); layer?.updateStyle({ clim })
}
function initClim() {
  for (const s of [cmin, cmax]) { s.min = CLIM_RANGE[0]; s.max = CLIM_RANGE[1]; s.step = 1 }
  for (const s of [cminNum, cmaxNum]) { s.min = CLIM_RANGE[0]; s.max = CLIM_RANGE[1] }
  renderClimUI()
}
cmin.oninput = () => setClim(+cmin.value, +cmax.value)
cmax.oninput = () => setClim(+cmin.value, +cmax.value)
cminNum.onchange = () => setClim(+cminNum.value, +cmaxNum.value)
cmaxNum.onchange = () => setClim(+cminNum.value, +cmaxNum.value)

/* colormap list */
for (const name of COLORMAP_NAMES) el('cmap').add(new Option(name, name))
el('cmap').value = params.get('cmap') ?? 'bone'
el('logscale').checked = params.get('log') !== '0'   // log on by default

/* click readout */
map.on('click', async (e) => {
  const where = `${e.latlng.lat.toFixed(2)}, ${e.latlng.lng.toFixed(2)}`
  readoutEl.textContent = `${where}: reading…`
  try {
    const spec = currentSpec()
    const v = await readValue(spec.variable, spec.dim, spec.idx, e.latlng)
    readoutEl.textContent = (v == null || Number.isNaN(v))
      ? `${where}: no data`
      : `${where}: σ0 ${v.toFixed(2)} — ${mode} ${currentDate()}` +
        (mode === 'pass' && slices[passI] ? ` ${slices[passI].hhmm}Z` : '')
  } catch (err) { console.error(err); readoutEl.textContent = `${where}: lookup failed (see console)` }
})

/* ---------- boot ---------- */
;(async () => {
